name: EVO-USO-01 browser checks
on:
  push:
    branches:
      - test/evo-uso-01-browser-20261118
  workflow_dispatch:
jobs:
  tutorial-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run TUT-01 to TUT-06
        run: python -m unittest discover -s tests -p 'test_tutorial_browser.py' -v
