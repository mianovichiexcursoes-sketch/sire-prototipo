{% extends 'sire/base.html' %}
{% block conteudo %}
<h1>Redefinir senha</h1>
{% if validlink %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Salvar nova senha</button></form>
{% else %}
<p>Este link é inválido ou expirou. <a href="{% url 'sire:recuperar_senha' %}">Solicite outro link</a>.</p>
{% endif %}
<p><a href="{% url 'sire:login' %}">Voltar para entrar</a></p>
{% endblock %}
