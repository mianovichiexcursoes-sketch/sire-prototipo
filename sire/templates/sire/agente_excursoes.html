{% extends 'sire/base.html' %}{% block conteudo %}<h1>Excursões — {{ agencia }}</h1><a href="{% url 'sire:cadastrar_excursao' %}">Nova excursão</a>{% for excursao in excursoes %}<article><h2>{{ excursao.titulo }}</h2><p>{{ excursao.destino }} · {{ excursao.get_status_display }}</p><a href="{% url 'sire:editar_excursao' excursao.id %}">Editar</a></article>{% empty %}<p>Nenhuma excursão cadastrada.</p>{% endfor %}{% endblock %}
